name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag harus valid dan sama dengan versi di semua manifest
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - name: Validasi dan tes
        run: |
          node scripts/validate.mjs
          npm test
      - name: Bangun ZIP runtime (reproducible) dan checksum
        run: node scripts/pack.mjs
      - name: Catatan rilis dari CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Hapus draft lama untuk tag ini (bila ada)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          for id in $IDS; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            $FLAGS
